<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="description" content="LIFT – gestão completa para personal trainers: alunos, treinos, agenda e cobranças em um só app.">
  <title>LIFT</title>
  <link rel="icon" href="assets/icons/lift-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/lift-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/personal.css">
  <link rel="stylesheet" href="css/student.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/demo.css">
</head>
<body>
  <div class="stage">
    <aside class="stage-brand" aria-hidden="true">
      <div class="stage-logo">
        <img src="assets/images/lift-logo.png" alt="" width="150" height="48">
      </div>
      <h2 class="stage-title">Seu negócio de personal, organizado em um só app.</h2>
      <ul class="stage-list">
        <li>Alunos, anamnese e evolução física</li>
        <li>Treinos montados em minutos</li>
        <li>Agenda com aviso automático ao aluno</li>
        <li>Cobranças por PIX e cartão</li>
      </ul>
      <p class="stage-foot">Disponível para iOS e Android</p>
    </aside>

    <div class="device" id="device">
      <div class="statusbar" aria-hidden="true">
        <span class="statusbar-time" id="statusTime">9:41</span>
        <span class="statusbar-island"></span>
        <span class="statusbar-icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.2-1.2A10.3 10.3 0 0 0 8 .5 10.3 10.3 0 0 0 .6 3.5l1.2 1.2A8.6 8.6 0 0 1 8 2.2zm0 3.4c1.5 0 2.8.6 3.8 1.5L13 5.9A7.1 7.1 0 0 0 8 3.9a7.1 7.1 0 0 0-5 2l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8 11.1 6.5 9.6c.4-.4.9-.6 1.5-.6z" fill="currentColor"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".45"/></svg>
        </span>
      </div>
      <div id="app" class="app"></div>
      <div id="sheet-root"></div>
      <div id="busy-root"></div>
      <div id="toast-root" aria-live="polite"></div>
    </div>
  </div>

  <button type="button" class="demo-fab" id="demoFab" aria-label="Abrir painel de demonstração" aria-controls="demoPanel" aria-expanded="false" title="Painel de demonstração (Shift + D)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
  </button>
  <div id="demo-root"></div>

  <noscript><p class="noscript">O LIFT precisa de JavaScript habilitado para funcionar.</p></noscript>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/rf01-auth.js"></script>
  <script src="js/rf02-onboarding.js"></script>
  <script src="js/rf03-students-workouts.js"></script>
  <script src="js/rf04-schedule.js"></script>
  <script src="js/rf05-billing.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
